x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    mem_limit: "256m"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  wa-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      API_PORT: 3001
      REDIS_URL: redis://redis:6379
      WA_SESSION_PATH: /app/sessions
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/.secrets/firebase-adminsdk.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      WA_API_PUBLIC_URL: ${WA_API_PUBLIC_URL:-http://zapflow.duckdns.org:3001}
      WA_STATUS_MEDIA_PATH: /app/status-media
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
    volumes:
      - wa_sessions:/app/sessions
      - wa_status_media:/app/status-media
      - ${SECRETS_DIR:-./.secrets}:/app/.secrets:ro
    mem_limit: "512m"

volumes:
  redis_data:
  wa_sessions:
  wa_status_media:
