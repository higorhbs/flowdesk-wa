services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-ghcr.io/higorhbs/flowdesk-api:latest}
    restart: unless-stopped
    init: true
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      NODE_ENV: production
      PORT: 3001
      ENABLE_WORKERS: "true"
      WEB_ORIGIN: ${WEB_ORIGIN:-https://flowdesk.ia.br}
      CORS_ORIGIN: ${CORS_ORIGIN}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://zapflow.duckdns.org}
      WA_API_PUBLIC_URL: ${WA_API_PUBLIC_URL:-https://zapflow.duckdns.org}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/.secrets/firebase-adminsdk.json}
      INTERNAL_NOTIFY_SECRET: ${INTERNAL_NOTIFY_SECRET:-change-me-internal-secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVACY_RETENTION_INTERVAL_HOURS: ${PRIVACY_RETENTION_INTERVAL_HOURS:-24}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_UNLIMITED: ${STRIPE_PRICE_UNLIMITED:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_DEFAULT_CPF_CNPJ: ${ASAAS_DEFAULT_CPF_CNPJ:-}
    volumes:
      - ${SECRETS_DIR:-./.secrets}:/app/.secrets:ro

volumes:
  caddy_data:
  caddy_config:
